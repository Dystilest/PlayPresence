<svg xmlns="http://www.w3.org/2000/svg" width="640" height="232" viewBox="0 0 640 232" role="img" aria-labelledby="t d">
  <title id="t">Example of a PlayPresence status on a Discord profile</title>
  <desc id="d">A card reading "Watching Jellyfin": Severance, S01E02 · Half Loop, with a poster, a progress bar at 12:04 of 50:00, and TMDb and IMDb buttons.</desc>
  <defs>
    <linearGradient id="poster" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b4a6b"/>
      <stop offset="1" stop-color="#1c2335"/>
    </linearGradient>
  </defs>
  <rect width="640" height="232" rx="14" fill="#232428"/>
  <text x="24" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.6" fill="#b5bac1">WATCHING JELLYFIN</text>

  <rect x="24" y="56" width="104" height="148" rx="8" fill="url(#poster)"/>
  <rect x="52" y="104" width="48" height="34" rx="4" fill="none" stroke="#8ea0c8" stroke-width="3"/>
  <path d="M68 146 h16" stroke="#8ea0c8" stroke-width="3" stroke-linecap="round"/>
  <text x="76" y="182" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8ea0c8">poster</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="148" y="82" font-size="20" font-weight="700" fill="#f2f3f5">Severance</text>
    <text x="148" y="110" font-size="16" fill="#dbdee1">S01E02 · Half Loop</text>

    <rect x="148" y="132" width="300" height="6" rx="3" fill="#4e5058"/>
    <rect x="148" y="132" width="72" height="6" rx="3" fill="#f2f3f5"/>
    <text x="148" y="158" font-size="12" fill="#b5bac1">12:04</text>
    <text x="448" y="158" text-anchor="end" font-size="12" fill="#b5bac1">50:00</text>

    <rect x="148" y="174" width="140" height="32" rx="6" fill="#4e5058"/>
    <text x="218" y="195" text-anchor="middle" font-size="14" font-weight="600" fill="#f2f3f5">TMDb</text>
    <rect x="298" y="174" width="140" height="32" rx="6" fill="#4e5058"/>
    <text x="368" y="195" text-anchor="middle" font-size="14" font-weight="600" fill="#f2f3f5">IMDb</text>
  </g>

  <text x="616" y="216" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6d6f78">illustration</text>
</svg>
