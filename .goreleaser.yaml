version: 2
project_name: playpresence

before:
  hooks:
    - go mod tidy

builds:
  - id: playpresence
    main: ./cmd/playpresence
    binary: playpresence
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/Dystilest/PlayPresence/internal/version.Version={{ .Version }}
      - -X github.com/Dystilest/PlayPresence/internal/version.Commit={{ .ShortCommit }}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^feat'
    - title: Fixes
      regexp: '^fix'
    - title: Other
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore'

release:
  draft: false
  prerelease: auto
